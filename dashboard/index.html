<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApexWeb OS</title>
<style>
:root{--bg:#f4f5f8;--bg2:#eceef3;--panel:#ffffff;--ink:#141821;--muted:#5d6675;--line:#e2e5ec;--accent:#4f46e5;--accent2:#0d9488;--accent-ink:#fff;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--run:#4f46e5;--wait:#6b7280;--chip:#eef0f5;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e14;--bg2:#10141c;--panel:#151a23;--ink:#e6e9ef;--muted:#8d97a8;--line:#232a36;--accent:#8b83ff;--accent2:#2dd4bf;--accent-ink:#0b0e14;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--run:#8b83ff;--wait:#7c8595;--chip:#1c2330;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0b0e14;--bg2:#10141c;--panel:#151a23;--ink:#e6e9ef;--muted:#8d97a8;--line:#232a36;--accent:#8b83ff;--accent2:#2dd4bf;--accent-ink:#0b0e14;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--run:#8b83ff;--wait:#7c8595;--chip:#1c2330;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{border-right:1px solid var(--line);padding:18px 12px;background:var(--bg2);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;margin:0 8px 18px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:15px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.side button:hover{background:var(--chip);color:var(--ink)}
nav.side button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
nav.side button .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
nav.side button[aria-current="page"] .dot{background:var(--accent);opacity:1}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.side-foot .btn{display:inline-flex;width:auto;border:1px solid var(--line);color:var(--ink);background:var(--panel);font-size:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
main{padding:24px 28px;min-width:0;max-width:1500px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.2px}h2{font-size:15px;margin:0 0 12px}h3{font-size:12px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.kpi .l{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:8px;cursor:pointer;min-height:34px;font-weight:500;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.side button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12.5px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--chip);font-size:12px;white-space:nowrap;font-weight:500}
.s-COMPLETED,.s-APPROVED,.s-ok,.s-healthy{color:var(--ok)}.s-RUNNING,.s-ASSIGNED,.s-REVIEW,.s-progress,.s-ASSEMBLING{color:var(--run)}
.s-FAILED,.s-BLOCKED,.s-error,.s-disabled{color:var(--err)}.s-RETRYING,.s-warning,.s-cooldown,.s-degraded,.s-NEEDS_ATTENTION,.s-AWAITING_APPROVAL{color:var(--warn)}
.s-WAITING,.s-QUEUED,.s-CANCELLED,.s-exhausted,.s-PLANNING{color:var(--wait)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:4px}
.msg{max-width:820px;margin:0 0 14px;white-space:pre-wrap}.msg .who{font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.msg .body{background:var(--chip);display:inline-block;padding:10px 14px;border-radius:12px}
.msg.user .body{background:var(--accent);color:var(--accent-ink)}
.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.composer textarea{flex:1;min-height:46px;max-height:160px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.bar{font-family:var(--mono);white-space:pre}
.meter{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:6px}.meter>i{display:block;height:100%;background:var(--accent2);border-radius:999px;transition:width .6s}
.meter.hot>i{background:var(--warn)}.meter.done>i{background:var(--ok)}.meter.full>i{background:var(--err)}
.stages{display:flex;gap:3px;margin:10px 0}.stages span{flex:1;height:8px;background:var(--chip);border-radius:3px}.stages span.done{background:var(--ok)}.stages span.now{background:var(--accent)}
.stage-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.dag{display:flex;gap:14px;overflow:auto;padding-bottom:6px}.dag .col{min-width:200px;display:flex;flex-direction:column;gap:8px}
.node{border:1px solid var(--line);border-left:4px solid var(--wait);border-radius:8px;padding:7px 9px;font-size:12.5px;background:var(--panel);cursor:pointer}
.node.COMPLETED{border-left-color:var(--ok)}.node.RUNNING,.node.ASSIGNED,.node.REVIEW{border-left-color:var(--run)}.node.FAILED,.node.BLOCKED{border-left-color:var(--err)}.node.RETRYING{border-left-color:var(--warn)}
.feed{max-height:70vh;overflow:auto}.feed .item{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.feed .agent{font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.agent-card{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.avatar{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--chip);color:var(--muted)}
.agent-card.busy{border-color:var(--accent)}.agent-card.busy .avatar{background:var(--accent);color:var(--accent-ink)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.pulse.off{background:var(--err);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.meter>i{transition:none}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:min(900px,94vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,8,15,.55)}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--chip);padding:10px;border-radius:8px;max-height:60vh;overflow:auto}
.login{max-width:420px;margin:15vh auto}.login input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--bg)}
@media (max-width:760px){.app{grid-template-columns:1fr}nav.side{position:static;height:auto;flex-direction:row;overflow-x:auto;gap:4px;padding:8px}nav.side button{width:auto;white-space:nowrap}.brand,.side-foot{display:none}main{padding:14px 16px}}
</style>
</head>
<body>
<div id="login" class="login panel" hidden>
  <h1>ApexWeb OS</h1>
  <p class="muted">Enter the API token (APEXWEB_API_TOKEN). It stays in this browser tab only.</p>
  <label for="tok">API token</label>
  <input id="tok" type="password" autocomplete="off">
  <button class="btn primary" id="tokbtn">Sign in</button>
  <p id="loginerr" class="s-error"></p>
</div>
<div class="app" id="app" hidden>
  <nav class="side" aria-label="Sections">
    <div class="brand"><span class="logo" aria-hidden="true">A</span><span>ApexWeb OS<small>Autonomous agency</small></span></div>
    <button data-view="overview"><span class="dot" aria-hidden="true"></span>Overview</button>
    <button data-view="chat"><span class="dot" aria-hidden="true"></span>Main Agent</button>
    <button data-view="projects"><span class="dot" aria-hidden="true"></span>Projects</button>
    <button data-view="agents"><span class="dot" aria-hidden="true"></span>Agents</button>
    <button data-view="activity"><span class="dot" aria-hidden="true"></span>Live activity</button>
    <button data-view="approvals"><span class="dot" aria-hidden="true"></span>Approvals<span class="badge" id="apbadge" hidden></span></button>
    <button data-view="keys"><span class="dot" aria-hidden="true"></span>NVIDIA keys & usage</button>
    <button data-view="skills"><span class="dot" aria-hidden="true"></span>Skills</button>
    <button data-view="knowledge"><span class="dot" aria-hidden="true"></span>Knowledge</button>
    <button data-view="obsidian"><span class="dot" aria-hidden="true"></span>Obsidian</button>
    <button data-view="workers"><span class="dot" aria-hidden="true"></span>Workers</button>
    <div class="side-foot"><div class="row"><span class="pulse" id="livedot"></span><span id="livetxt">Connecting…</span></div><div class="row" style="margin-top:8px"><button class="btn" id="themebtn" style="min-height:28px;padding:2px 10px">Theme</button><button class="btn" id="signout" style="min-height:28px;padding:2px 10px">Sign out</button></div></div>
  </nav>
  <main id="view"></main>
</div>
<dialog id="dlg"><div class="row" style="justify-content:space-between"><h2 id="dlgtitle"></h2><button class="btn" onclick="dlg.close()">Close</button></div><div id="dlgbody"></div></dialog>
<script>
const STAGES=['INTAKE','RESEARCH','PLANNING','DESIGN','DEVELOPMENT','CONTENT','INTEGRATION','TESTING','QA','REVISION','FINAL_REVIEW','READY_FOR_HANDOFF','COMPLETED'];
let token=null;try{token=sessionStorage.getItem('apx_token')}catch{}
{const m=location.hash.match(/token=([^&]+)/);if(m){token=decodeURIComponent(m[1]);try{sessionStorage.setItem('apx_token',token)}catch{};history.replaceState(null,'',location.pathname+location.search)}}
try{const th=localStorage.getItem('apx_theme');if(th)document.documentElement.dataset.theme=th}catch{}
let current={view:'chat',project:null};let timers=[];let feedAbort=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(r.status===401){signOut();throw new Error('unauthorized')}const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=t}if(!r.ok)throw new Error(j.message||j.error||r.status);return j}
function signOut(){try{sessionStorage.removeItem('apx_token')}catch{}token=null;$('#app').hidden=true;$('#login').hidden=false}
$('#tokbtn').onclick=async()=>{token=$('#tok').value.trim();try{await api('/v1/metrics');try{sessionStorage.setItem('apx_token',token)}catch{};start()}catch(e){$('#loginerr').textContent='Sign-in failed: '+e.message}};
function clearTimers(){timers.forEach(clearInterval);timers=[];if(feedAbort){feedAbort.abort();feedAbort=null}}
function every(fn,ms){fn();timers.push(setInterval(fn,ms))}
async function checkKeys(){modal('Key check','<p class="muted">Checking each key (one leased request per key)…</p>');try{const {results}=await api('/v1/keys/check',{method:'POST',body:'{}'});modal('Key check',`<table><thead><tr><th>Key</th><th>Result</th><th>Detail</th></tr></thead><tbody>${results.map(r=>`<tr><td class="mono">${esc(r.key)} ${esc(r.masked)}</td><td class="${r.ok?'s-ok':'s-error'}">${r.ok?'OK':'FAIL'}</td><td>${r.ok?`${r.models_visible} models visible · ${r.latency_ms}ms${r.registry_models_missing.length?` · not visible: ${esc(r.registry_models_missing.join(', '))}`:''}`:esc(`${r.http_status??'no response'} ${r.error??''}`)}</td></tr>`).join('')}</tbody></table>`)}catch(e){modal('Key check',`<p class="s-error">${esc(e.message)}</p>`)}}
function show(view,project){clearTimers();current.view=view;if(project!==undefined)current.project=project;document.querySelectorAll('nav.side button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));(VIEWS[view]||VIEWS.chat)()}
document.querySelectorAll('nav.side button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function modal(title,html){$('#dlgtitle').textContent=title;$('#dlgbody').innerHTML=html;if(!$('#dlg').open)$('#dlg').showModal()}
const bar=(u,c,w=23)=>{const f=c>0?Math.round(Math.min(u,c)/c*w):0;return '█'.repeat(f)+'░'.repeat(w-f)};

const VIEWS={
async overview(){every(async()=>{const [m,ap,pr,run,act,ob,nm]=await Promise.all([api('/v1/metrics'),api('/v1/approvals?status=pending'),api('/v1/projects'),api('/v1/tasks?status=RUNNING'),api('/v1/activity?limit=12'),api('/v1/integrations/obsidian').catch(()=>({enabled:false})),names()]);
  const projects=pr.projects.slice(0,6);const acts=[...(act.items||[])].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,10);
  $('#view').innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>Overview</h1><p class="muted">Everything the agency is doing right now.</p></div><button class="btn primary" id="newwork">New request</button></div>
  <div class="kpis">
   <div class="kpi"><div class="v s-RUNNING">${m.tasks.active}</div><div class="l">tasks running</div></div>
   <div class="kpi"><div class="v">${m.tasks.queued+m.tasks.waiting}</div><div class="l">queued / waiting</div></div>
   <div class="kpi"><div class="v">${m.tasks.completed}</div><div class="l">tasks completed</div></div>
   <div class="kpi"><div class="v ${ap.approvals.length?'s-warning':''}">${ap.approvals.length}</div><div class="l">waiting for your approval</div></div>
   <div class="kpi"><div class="v ${m.tasks.failed?'s-error':''}">${m.tasks.failed}</div><div class="l">failed tasks</div></div>
   <div class="kpi"><div class="v">${m.nvidia.requests_last_minute}</div><div class="l">NVIDIA requests / min</div></div>
  </div>
  ${ap.approvals.length?`<div class="panel" style="border-color:var(--warn)"><h2 class="s-warning">Needs your decision</h2>${ap.approvals.map(a=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span><strong>${esc(a.title)}</strong> <span class="chip">${esc(a.gate)}</span></span><span class="row"><button class="btn primary" data-apr="${esc(a.id)}" data-d="approve">Approve</button><button class="btn" data-apr="${esc(a.id)}" data-d="reject">Reject</button></span></div>`).join('')}</div>`:''}
  <div class="grid2">
   <div class="panel"><h2>Working right now</h2>${run.tasks.length?run.tasks.slice(0,10).map(t=>{const n=nm.get(t.agent_type)||t.agent_type;return `<div class="agent-card busy" style="margin-bottom:8px"><span class="avatar">${esc(initials(n))}</span><span><strong>${esc(n)}</strong><div class="muted">${esc(t.title)}</div></span></div>`}).join(''):'<p class="muted">All agents are idle.</p>'}</div>
   <div class="panel"><h2>NVIDIA key pool</h2>${m.nvidia.keys.map(k=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span><strong>${esc(k.id.replace('key_','Key '))}</strong> <span class="chip s-${esc(k.health)}">${esc(k.health)}</span></span><span class="mono muted">${k.rpm_used}/${k.rpm_ceiling} RPM</span></div>${meter(k.rpm_used,k.rpm_ceiling)}</div>`).join('')||'<p class="muted">No keys configured.</p>'}</div>
  </div>
  <div class="grid2">
   <div class="panel"><h2>Projects</h2>${projects.map(p=>{const pg=p.progress||{};const tot=pg.total||0,done=pg.completed||0;return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between"><a href="#" data-p="${esc(p.id)}"><strong>${esc(p.name)}</strong></a><span class="chip s-${esc(p.status)}">${esc(p.status)}</span></div><div class="muted" style="font-size:12.5px">${esc((p.stage||'').replace(/_/g,' '))}${tot?` · ${done}/${tot} tasks`:''}</div>${tot?meter(done,tot,true):''}</div>`}).join('')||'<p class="muted">No projects yet. Send a request to the Main Agent.</p>'}</div>
   <div class="panel"><h2>Latest activity</h2><div class="feed" style="max-height:none">${acts.map(it=>`<div class="item"><span class="muted mono">${new Date(it.at).toLocaleTimeString()}</span><span><span class="agent s-${esc(it.severity)}">${esc(it.agent)}</span><br>${esc(it.headline)}</span></div>`).join('')||'<p class="muted">Nothing yet.</p>'}</div></div>
  </div>
  <div class="panel row" style="justify-content:space-between"><span><strong>Obsidian</strong> <span class="muted">${ob.enabled?`connected · ${ob.notes_written} notes written · ${ob.inbox_processed} inbox requests`:'not connected (set OBSIDIAN_VAULT_PATH)'}</span></span>${ob.enabled?`<a class="btn" href="obsidian://open?path=${encodeURIComponent((ob.folder_host||ob.folder)+'/Home.md')}">Open in Obsidian</a>`:''}</div>`;
  $('#newwork').onclick=()=>show('chat',null);
  document.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();show('projects',a.dataset.p)});
  document.querySelectorAll('[data-apr]').forEach(b=>b.onclick=async()=>{try{await api('/v1/approvals/'+b.dataset.apr+'/'+b.dataset.d,{method:'POST',body:'{}'})}catch(err){alert(err.message)}});
 },5000)},
async agents(){every(async()=>{const [ag,run]=await Promise.all([api('/v1/agents'),api('/v1/tasks?status=RUNNING')]);const busy=new Map(run.tasks.map(t=>[t.agent_type,t]));const list=ag.agents||[];const depts=[...new Set(list.map(a=>a.department))];
  $('#view').innerHTML=`<h1>Agents</h1><p class="muted">${list.length} agents · ${busy.size} working now. Highlighted agents are running a task.</p>${depts.map(d=>`<h3>${esc(d)}</h3><div class="grid3">${list.filter(a=>a.department===d).map(a=>{const t=busy.get(a.type);const done=(a.tasks&&a.tasks.COMPLETED)||0;return `<div class="agent-card ${t?'busy':''}"><span class="avatar">${esc(initials(a.name))}</span><span><strong>${esc(a.name)}</strong>${a.parent?' <span class="chip">sub-agent</span>':''}<div class="muted clamp" style="font-size:12.5px">${t?`<span class="s-RUNNING">Working:</span> ${esc(t.title)}`:esc(a.mission||'')}</div><div class="muted mono" style="font-size:11.5px;margin-top:2px">${done} task(s) completed</div></span></div>`}).join('')}</div>`).join('')}`;
 },4000)},
async obsidian(){const ob=await api('/v1/integrations/obsidian');$('#view').innerHTML=`<h1>Obsidian</h1>${ob.enabled?`<div class="panel"><p class="row"><span class="pulse"></span> Connected to <span class="mono">${esc(ob.vault)}</span></p><p class="muted">Notes written: ${ob.notes_written} · Inbox requests processed: ${ob.inbox_processed} · Last sync: ${ob.last_sync_at?new Date(ob.last_sync_at).toLocaleString():'—'}${ob.last_error?` · <span class="s-error">${esc(ob.last_error)}</span>`:''}</p><div class="row"><a class="btn primary" href="obsidian://open?path=${encodeURIComponent((ob.folder_host||ob.folder)+'/Home.md')}">Open vault home</a><button class="btn" id="obsync">Sync now</button></div></div>

function layer(nodes,edges){const deps=new Map(nodes.map(n=>[n.id,[...(n.layout_after||[])]]));edges.filter(e=>!e.sub).forEach(e=>deps.get(e.to)?.push(e.from));const lvl=new Map();const get=(id,seen=new Set())=>{if(lvl.has(id))return lvl.get(id);if(seen.has(id))return 0;seen.add(id);const n=nodes.find(x=>x.id===id);const ds=(deps.get(id)||[]).filter(d=>nodes.some(x=>x.id===d));let l=ds.length?Math.max(...ds.map(d=>get(d,seen)+1)):0;if(n?.parent&&n.kind==='subtask')l=Math.max(l,get(n.parent,seen)+1);lvl.set(id,l);return l};nodes.forEach(n=>get(n.id));const cols=[];nodes.forEach(n=>{(cols[lvl.get(n.id)]??=[]).push(n)});return cols.filter(Boolean)}

function start(){$('#login').hidden=true;$('#app').hidden=false;show('overview');heartbeat();setInterval(heartbeat,8000)}
async function heartbeat(){try{const [h,a]=await Promise.all([fetch('/healthz').then(r=>r.json()),api('/v1/approvals?status=pending')]);$('#livedot').className='pulse';$('#livetxt').textContent=`Live · ${h.driver} driver · ${h.keys_configured} key(s)`;const n=(a.approvals||[]).length;const b=$('#apbadge');b.hidden=!n;b.textContent=n}catch(e){$('#livedot').className='pulse off';$('#livetxt').textContent='Core unreachable'}}
$('#themebtn').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('apx_theme',nx)}catch{}};
$('#signout').onclick=()=>signOut();
const initials=n=>String(n).split(/[\s/&]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const meter=(u,c,progress)=>{const p=c>0?Math.min(100,Math.round(u/c*100)):0;return `<div class="meter ${progress?(p>=100?'done':''):p>=100?'full':p>=80?'hot':''}" role="img" aria-label="${u} of ${c}"><i style="width:${p}%"></i></div>`};
let agentNames=null;async function names(){if(!agentNames){const {agents}=await api('/v1/agents');agentNames=new Map(agents.map(a=>[a.type,a.name]))}return agentNames}

if(token)api('/v1/metrics').then(start).catch(()=>{$('#login').hidden=false});else $('#login').hidden=false;
</script>
