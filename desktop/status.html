<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ApexWeb OS</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<style>
:root{color-scheme:dark}html,body{margin:0;height:100%;background:#0b0e14;color:#e6e9ef;font:15px/1.5 "Inter","Segoe UI",system-ui,sans-serif}
main{height:100%;display:grid;place-items:center;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:18px;background:#4f46e5;display:grid;place-items:center;font-weight:800;font-size:34px}
.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#8b83ff;animation:b 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
p{color:#8d97a8;max-width:460px}
</style></head>
<body><main><div><div class="logo">A</div><h1 style="margin:0 0 6px;font-size:22px">ApexWeb OS</h1><p id="d"></p><div class="dots"><span></span><span></span><span></span></div>
<p style="font-size:13px">The app keeps trying automatically. If this persists, make sure Docker Desktop is running, then use the tray icon → <em>Start services</em>.</p></div></main>
<script>document.getElementById('d').textContent=new URLSearchParams(location.search).get('detail')||'Starting…'</script>
</body></html>
